name: Bias eval (live models)

# Counterfactual fairness audit against real model outputs. Costs money, so it
# runs weekly and on demand rather than on every PR. Deterministic fairness
# checks (routing blind to client identity, equal safety across experience
# levels) run on every PR in the main CI workflow.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bias:
    name: Counterfactual persona audit
    runs-on: ubuntu-latest
    if: ${{ vars.CASEVEX_BIAS_EVAL_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:bias
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
